<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marvisaer</title>
<meta name="description" content="Marvisaer – Tools für mich und meine Freunde.">
<meta name="theme-color" content="#101629">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column of tool cards under a wordmark; add a tool by copying one <a class="tool"> block. */
:root {
  --bg: #101629;
  --bg-2: #18203a;
  --line: rgba(232, 217, 184, 0.16);
  --ink: #f1e8d6;
  --ink-dim: rgba(241, 232, 214, 0.66);
  --accent: #f2b33d;
  --display: "Chakra Petch", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1px 1px at 12% 22%, rgba(241,232,214,.7) 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 14%, rgba(241,232,214,.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 64% 38%, rgba(241,232,214,.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 70%, rgba(241,232,214,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 90% 62%, rgba(241,232,214,.5) 50%, transparent 51%),
    var(--bg);
  color: var(--ink);
  font: 16px/1.55 var(--body);
  padding: max(28px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 40px; }
header { display: grid; gap: 10px; padding-top: 4vh; }
.mark {
  font: 700 clamp(2.6rem, 9vw, 5rem)/.9 var(--display);
  letter-spacing: .06em; text-transform: uppercase; margin: 0;
}
.mark span { color: var(--accent); }
.tagline { margin: 0; color: var(--ink-dim); font-size: 1.05rem; max-width: 50ch; }
h2 { font: 700 .85rem var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); margin: 0 0 14px; }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tool {
  display: grid; gap: 8px; align-content: start; padding: 20px; min-height: 170px;
  background: var(--bg-2); border: 1px solid var(--line); color: inherit; text-decoration: none;
  transition: border-color .15s, transform .15s;
}
a.tool:hover { border-color: var(--accent); transform: translateY(-2px); }
a.tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.tool .tag { font: 700 .72rem var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.tool h3 { font: 700 1.4rem/1.1 var(--display); margin: 0; text-transform: uppercase; letter-spacing: .03em; }
.tool p { margin: 0; color: var(--ink-dim); font-size: .95rem; }
.tool .go { margin-top: auto; font-weight: 600; color: var(--ink); }
.tool.soon { background: transparent; border-style: dashed; }
.tool.soon h3 { color: var(--ink-dim); }
footer { color: var(--ink-dim); font-size: .85rem; border-top: 1px solid var(--line); padding-top: 14px; }
@media (prefers-reduced-motion: reduce) { .tool { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="mark">Marvis<span>aer</span></h1>
    <p class="tagline">Tools für mich und meine Freunde.</p>
  </header>

  <main>
    <h2>Tools</h2>
    <div class="tools">
      <a class="tool" href="battlefront/">
        <span class="tag">Star Wars Battlefront · Co-op</span>
        <h3>Loadout Roulette</h3>
        <p>Würfelt für beide Spieler einen Blaster und eine Hand für die Überleben-Mission.</p>
        <span class="go">Öffnen →</span>
      </a>
      <div class="tool soon">
        <span class="tag">Bald</span>
        <h3>Nächstes Tool</h3>
        <p>Hier kommt das nächste Tool hin.</p>
      </div>
    </div>
  </main>

  <footer>Marvisaer</footer>
</div>
</body>
</html>
